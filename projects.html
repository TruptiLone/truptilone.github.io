var PAGE=6,shown=PAGE,active="All";
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function list(){return active==="All"?PROJECTS:PROJECTS.filter(function(p){return p.cats.indexOf(active)>-1})}
function card(p){
  var roleLine=[p.role,p.date].filter(Boolean).join(" • ");
  return '<article class="proj" id="'+p.id+'"><h2>'+esc(p.title)+'</h2>'+
  (p.context?'<p class="context'+(p.award?' award':'')+'">'+esc(p.context)+'</p>':'')+
  (roleLine?'<p class="role">'+esc(roleLine)+'</p>':'')+
  '<p class="desc">'+esc(p.desc)+'</p>'+
  (p.result?'<p class="result"><b>Result</b><span>'+esc(p.result)+'</span></p>':'')+
  '<div class="tags">'+p.tech.map(function(t){return '<span>'+esc(t)+'</span>'}).join("")+'</div>'+
  '<div class="proj-links">'+p.links.map(function(l){return '<a href="'+esc(l[1])+'" target="_blank" rel="noreferrer">'+esc(l[0])+' ↗</a>'}).join("")+'</div></article>';
}
function render(){
  var items=list();
  document.getElementById("grid").innerHTML=items.slice(0,shown).map(card).join("");
  document.getElementById("more").parentNode.style.display=items.length>shown?"":"none";
  document.getElementById("filters").innerHTML=CATEGORIES.map(function(c){
    var n=c==="All"?PROJECTS.length:PROJECTS.filter(function(p){return p.cats.indexOf(c)>-1}).length;
    return '<button type="button" aria-pressed="'+(c===active)+'" data-cat="'+esc(c)+'">'+esc(c)+'<span class="count">'+n+'</span></button>'}).join("");
}
document.getElementById("filters").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;active=b.getAttribute("data-cat");shown=PAGE;render()});
document.getElementById("more").addEventListener("click",function(){shown+=PAGE;render()});
/* Deep links: projects.html#studentlytics opens with that card visible */
(function(){var h=location.hash.slice(1),i=PROJECTS.findIndex(function(p){return p.id===h});if(i>=PAGE)shown=i+1;render();if(h){var el=document.getElementById(h);if(el)el.scrollIntoView()}})();
</script>
